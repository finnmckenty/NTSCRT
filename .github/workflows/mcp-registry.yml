# Lists each release in the official MCP Registry
# (https://registry.modelcontextprotocol.io), as io.github.finnmckenty/ntscrt.
# It points at the release's Claude Desktop extension (ntscrt-mcp-<v>.mcpb,
# from scripts/make-mcpb.sh), so it runs once the release is published with
# that file attached. Signs in with GitHub's own OIDC token: no secret.
name: MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to list (e.g. v0.26.4)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Fill in this release's extension
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          FILE="ntscrt-mcp-${VERSION}.mcpb"
          gh release download "$TAG" --pattern "$FILE" --dir /tmp
          SHA=$(sha256sum "/tmp/$FILE" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FILE}"
          jq --arg v "$VERSION" --arg u "$URL" --arg s "$SHA" \
            '.version = $v | .packages[0].identifier = $u | .packages[0].fileSha256 = $s' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Sign in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
