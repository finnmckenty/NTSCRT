# NTSCRT for Windows. The Mac app doesn't use anything here.
[workspace]
members = ["engine", "media", "spike", "app"]
# librashader (port/fetch-librashader.sh) is its own workspace.
exclude = ["vendor"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ntsc-rs = { path = "../Vendor/ntsc-rs/crates/ntscrs" }
# PINNED to the same commit as the Mac app's librashader.dylib (see DEVELOPMENT.md),
# plus port/librashader-wgpu-push-constants.patch via the [patch] below.
librashader = { git = "https://github.com/SnowflakePowered/librashader", rev = "76462c030b75c4f2d56e5386c3d4d7d1128318b8", default-features = false, features = ["runtime-wgpu", "presets", "preprocess", "stable"] }

[profile.release]
debug = false

# port/vendor/librashader: a checkout of the pin with the patch applied,
# created by port/fetch-librashader.sh.
[patch."https://github.com/SnowflakePowered/librashader"]
librashader = { path = "vendor/librashader/librashader" }
