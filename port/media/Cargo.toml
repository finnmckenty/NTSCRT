[package]
name = "ntscrt-media"
version = "0.1.0"
edition = "2021"
description = "Video in and out for NTSCRT on Windows (Media Foundation)"
license = "MIT"
publish = false

[dependencies]
anyhow.workspace = true
image.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

[dev-dependencies]

[[bin]]
name = "media-probe"
path = "src/bin/probe.rs"
