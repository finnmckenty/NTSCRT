[package]
name = "ntscrt"
version = "0.1.0"
edition = "2021"
description = "NTSCRT for Windows"
license = "MIT"
publish = false

[[bin]]
name = "ntscrt"
path = "src/main.rs"

# The command line in a terminal (ntscrt.exe is a windowed program).
[[bin]]
name = "ntscrt-cli"
path = "src/bin/ntscrt-cli.rs"

[dependencies]
anyhow.workspace = true
ntscrt-media = { path = "../media" }
image.workspace = true
ntscrt-engine = { path = "../engine" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = "0.18"
gif = "0.13"
# The update check: GitHub over HTTPS with the system's TLS (SChannel on Windows).
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
# The command line's standard handles, the console launcher's job object,
# the Videos folder and local time.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
] }

# The app icon in the .exe files (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
